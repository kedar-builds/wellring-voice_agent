services:
  - type: web
    name: wellring-backend
    runtime: docker
    region: ohio
    plan: free
    branch: atharva-voice-work
    envVars:
      - key: USE_SUPABASE
        value: "false"
      - key: USE_TWILIO
        value: "true"
      - key: USE_WHATSAPP
        value: "true"
      - key: USE_ROUTINE_UPDATES
        value: "false"
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
      - key: CAREGIVER_PHONE
        sync: false
      - key: WELLRING_API_KEY
        sync: false

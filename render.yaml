services:
  - type: web
    name: wellring-backend
    runtime: docker
    region: ohio
    plan: free
    branch: main
    envVars:
      # --- Required secrets (set in Render dashboard, never committed) ---
      - key: WELLRING_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
      - key: CAREGIVER_PHONE
        sync: false

      # --- Feature flags (safe to commit) ---
      - key: USE_SUPABASE
        value: "false"
      - key: USE_TWILIO
        value: "true"
      - key: USE_WHATSAPP
        value: "true"
      - key: USE_ROUTINE_UPDATES
        value: "false"
      - key: DEBUG
        value: "false"

      # --- Supabase (disabled by default) ---
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""

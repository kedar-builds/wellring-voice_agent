[pytest]
# Only collect tests from the tests/ directory.
# The existing tests/test_llama.py, test_mic*.py, test_piper.py are
# hardware smoke tests requiring Ollama/microphone — excluded from CI.
testpaths = tests
pythonpath = .
python_files = test_assess.py test_health.py test_validation.py test_assessments_dashboard.py test_nemotron_watchdog.py test_notifications.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:.*starlette.testclient.*

